spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic}
    username: ${DB_USER:clinic_owner}
    password: ${DB_PASSWORD:clinic_owner}
    hikari:
      schema: clinic_app
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: clinic_app
        jdbc.time_zone: Asia/Kolkata
    hibernate.ddl-auto: validate
  flyway:
    schemas: clinic_app
    default-schema: clinic_app
    create-schemas: true
server:
  error:
    include-message: always
app:
  jwt-secret: ${JWT_SECRET:replace-this-with-a-very-long-development-secret-key}
  jwt-minutes: 480
  bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
